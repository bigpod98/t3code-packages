name: Daily main packages

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-main-packages
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve upstream main
    runs-on: ubuntu-24.04
    outputs:
      package_date: ${{ steps.source.outputs.package_date }}
      source_commit: ${{ steps.source.outputs.source_commit }}
      source_date_epoch: ${{ steps.source.outputs.source_date_epoch }}
      source_sha256: ${{ steps.source.outputs.source_sha256 }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - id: source
        name: Resolve source and calendar version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r source_commit source_date < <(
            gh api repos/pingdotgg/t3code/commits/main \
              --jq '"\(.sha) \(.commit.committer.date)"'
          )
          package_date="$(date -u +%F)"
          version="$(date -u -d "$package_date" +'%Y.%-m.%-d')"
          source_date_epoch="$(date -u -d "$source_date" +%s)"
          source_sha256="$(
            curl --fail --location --silent --show-error \
              "https://github.com/pingdotgg/t3code/archive/$source_commit.tar.gz" |
              sha256sum | cut -d " " -f 1
          )"

          {
            echo "package_date=$package_date"
            echo "source_commit=$source_commit"
            echo "source_date_epoch=$source_date_epoch"
            echo "source_sha256=$source_sha256"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      PACKAGE_DATE: ${{ needs.resolve.outputs.package_date }}
      NODE_VERSION: 24.13.1
      PNPM_VERSION: 11.10.0
      RELEASE: ${{ github.run_number }}
      SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
      SOURCE_DATE_EPOCH: ${{ needs.resolve.outputs.source_date_epoch }}
      SOURCE_REPOSITORY: https://github.com/pingdotgg/t3code
      SOURCE_SHA256: ${{ needs.resolve.outputs.source_sha256 }}
      RUST_VERSION: 1.97.1
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout packaging recipes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install native build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            appstream-util \
            build-essential \
            debhelper \
            desktop-file-utils \
            dpkg-dev \
            fakeroot \
            imagemagick \
            libsecret-1-dev \
            lintian \
            rpmlint \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version

      - name: Build native packages
        run: make packages

      - name: Validate packages
        run: make check REQUIRE_PACKAGES=1

      - name: Install packages in target distributions
        run: make install-test

      - name: Write package checksums
        run: sha256sum dist/*.deb dist/*.rpm > dist/SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t3code-daily-${{ needs.resolve.outputs.version }}-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
